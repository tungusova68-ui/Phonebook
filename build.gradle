
plugins {
    id 'java'
    id 'application'
}

group = 'ru.spbgut'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation files('C:/Users/tungu/openjfx-17.0.21_windows-x64_bin-sdk/javafx-sdk-17.0.21/lib/javafx.base.jar')
    implementation files('C:/Users/tungu/openjfx-17.0.21_windows-x64_bin-sdk/javafx-sdk-17.0.21/lib/javafx.controls.jar')
    implementation files('C:/Users/tungu/openjfx-17.0.21_windows-x64_bin-sdk/javafx-sdk-17.0.21/lib/javafx.fxml.jar')
    implementation files('C:/Users/tungu/openjfx-17.0.21_windows-x64_bin-sdk/javafx-sdk-17.0.21/lib/javafx.graphics.jar')
}

application {
    mainClass = 'ru.spbgut.phonebook.Main'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'ru.spbgut.phonebook.Main'
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
